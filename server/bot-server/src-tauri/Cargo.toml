[package]
name = "espbot-server-console"
version = "0.1.0"
edition = "2021"

[lib]
name = "espbot_server_console"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = { version = "0.8", features = ["ws"] }
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
