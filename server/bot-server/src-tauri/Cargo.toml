[package]
name = "espbot-server-console"
version = "0.2.3"
edition = "2021"

[lib]
name = "espbot_server_console"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["lan-diagnostics"]
lan-diagnostics = ["axum/ws"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "=1.10.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
tauri = { version = "2", features = [] }
axum = "0.8"
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "time", "sync", "process", "io-util", "fs", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22.1"
crc32fast = "1.5.3"
sha2 = "0.10.9"
ring = "0.17.14"
subtle = "2.6"
zeroize = "1"
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Default conversational brain (vendored Xiaodai core, see server/xiaodai-core).
xiaodai-fast-responder = { path = "../../xiaodai-core" }

[target.'cfg(target_os = "macos")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
