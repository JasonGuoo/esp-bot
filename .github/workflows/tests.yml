name: Brain and palette tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated face palette header
        run: python3 tools/generate_face_themes.py --check
      - name: Run unit tests
        run: python3 -m unittest discover -s server/tests -v
